name: build
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix: {os: [ubuntu-latest, windows-latest, macos-latest], python: ['3.11']}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: ${{ matrix.python }}}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -c "from server.main import app; print(app.title)"
  windows-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: ./build-windows.bat
      - uses: actions/upload-artifact@v4
        with: {name: red-potato-radar-windows, path: dist}
  macos-package:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: chmod +x build-macos.sh && ./build-macos.sh
      - uses: actions/upload-artifact@v4
        with: {name: red-potato-radar-macos, path: dist}
